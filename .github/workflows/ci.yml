name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Build (debug)
        run: swift build
      - name: Run tests
        run: swift test
      - name: Build universal release
        run: swift build -c release --arch arm64 --arch x86_64
